[package]
name = "drift"
version = "0.1.4"
description = "drift — Navidrome desktop client with Discord Rich Presence"
authors = ["drift contributors"]
edition = "2021"

[lib]
name = "drift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1.1.0"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "6"
url = "2"

# In-app updater. Desktop only — there is no bundle to swap out on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
